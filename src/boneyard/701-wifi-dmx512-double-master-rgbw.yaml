# two DMX universes on the same device, with 2 RGBCW fixtures (10 channels) on each universe.
# This is a test of the double master functionality of the DMX component, which allows two
# separate DMX universes to be output from the same device. The two universes are independent 
# of each other, and can be used to control different fixtures or groups of fixtures. The DMX 
# component will automatically handle the timing and synchronization of the two universes, so 
# that they can be used together without any issues. This is a great way to expand the number 
# of DMX channels available on a single device, without having to use multiple devices or complex wiring.

esp32:
  board: wt32-eth01
  cpu_frequency: 240MHZ
  framework:
    type: esp-idf

external_components:
  - source: github://andyboeh/esphome-dmx512

uart:
  - id: uart_bus1
    baud_rate: 250000
    tx_pin: 
      number: GPIO5   # RXD2 of the w32-eth01
      allow_other_uses: true # For ESPHome >= 2023.12.0
      inverted: false
    stop_bits: 2
    data_bits: 8
    parity: NONE
  - id: uart_bus2
    baud_rate: 250000
    tx_pin: 
      number: GPIO17   
      allow_other_uses: true # For ESPHome >= 2023.12.0
      inverted: false
    stop_bits: 2
    data_bits: 8
    parity: NONE


dmx512:
  - id: dmx_u1   # I think this might be the name of the universe in the output elements
    uart_id: uart_bus1
    #enable_pin: GPIO33
    tx_pin: 
      number: GPIO5
      allow_other_uses: true # For ESPHome >= 2023.12.0
    uart_num: 0
    force_full_frames: false
    periodic_update: true
    custom_break_len: 92 # 92=default optional
    custom_mab_len: 12 # 12=default optional
    update_interval: 500 # 500=default optional
  - id: dmx_u2   
    uart_id: uart_bus2
    #enable_pin: GPIO33
    tx_pin: 
      number: GPIO17
      allow_other_uses: true # For ESPHome >= 2023.12.0
    uart_num: 1
    force_full_frames: false
    periodic_update: true
    custom_break_len: 92 # 92=default optional
    custom_mab_len: 12 # 12=default optional
    update_interval: 500 # 500=default optional

output:
  - platform: dmx512
    channel: 1
    universe: dmx_u1
    id: dmx_u1_ch1  
  - platform: dmx512
    channel: 2
    universe: dmx_u1
    id: dmx_u1_ch2
  - platform: dmx512
    channel: 3
    universe: dmx_u1
    id: dmx_u1_ch3  
  - platform: dmx512
    channel: 4
    universe: dmx_u1
    id: dmx_u1_ch4
  - platform: dmx512
    channel: 5
    universe: dmx_u1
    id: dmx_u1_ch5  
  - platform: dmx512
    channel: 6
    universe: dmx_u1
    id: dmx_u1_ch6
  - platform: dmx512
    channel: 7
    universe: dmx_u1  
    id: dmx_u1_ch7
  - platform: dmx512
    channel: 8
    universe: dmx_u1
    id: dmx_u1_ch8    
  - platform: dmx512
    channel: 9
    universe: dmx_u1
    id: dmx_u1_ch9
  - platform: dmx512
    channel: 10
    universe: dmx_u1
    id: dmx_u1_ch10

  - platform: dmx512
    channel: 1
    universe: dmx_u2
    id: dmx_u2_ch1  
  - platform: dmx512
    channel: 2
    universe: dmx_u2
    id: dmx_u2_ch2
  - platform: dmx512
    channel: 3
    universe: dmx_u2
    id: dmx_u2_ch3  
  - platform: dmx512
    channel: 4
    universe: dmx_u2
    id: dmx_u2_ch4
  - platform: dmx512
    channel: 5
    universe: dmx_u2
    id: dmx_u2_ch5  
  - platform: dmx512
    channel: 6
    universe: dmx_u2
    id: dmx_u2_ch6
  - platform: dmx512
    channel: 7
    universe: dmx_u2  
    id: dmx_u2_ch7
  - platform: dmx512
    channel: 8
    universe: dmx_u2
    id: dmx_u2_ch8    
  - platform: dmx512
    channel: 9
    universe: dmx_u2
    id: dmx_u2_ch9
  - platform: dmx512
    channel: 10
    universe: dmx_u2
    id: dmx_u2_ch10


light:
  - platform: rgbw
    name: "Test Light U1-1"
    id: light_0
    red: dmx_u1_ch1
    green: dmx_u1_ch2
    blue: dmx_u1_ch3
    white: dmx_u1_ch4
    gamma_correct: 0
    default_transition_length: 0s
    effects:
      - strobe:
      - pulse:
      - random:
      - flicker:
  - platform: rgbw
    name: "Test Light U2-1"
    id: light_2
    red: dmx_u2_ch1
    green: dmx_u2_ch2
    blue: dmx_u2_ch3
    white: dmx_u2_ch4
    gamma_correct: 0
    default_transition_length: 0s
    effects:
      - strobe:
      - pulse:
      - random:
      - flicker:


